<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mission Control — Launch Sequence</title>
<link rel="stylesheet" href="/scene/scene.css" />
<link rel="stylesheet" href="/style.css" />
</head>
<body data-role="mc">
  <div id="scene-root"></div>

  <!-- Mission Control chrome, layered over the shared scene -->
  <header id="top-bar">
    <h1>LAUNCH SEQUENCE</h1>
    <div id="phase-pill" class="pill">WAITING FOR CREW</div>
  </header>

  <section id="crew-hud">
    <div class="hud-slot" data-slot="1"><div class="slot-num">1</div><div class="slot-name">Waiting to join…</div><div class="slot-status">—</div></div>
    <div class="hud-slot" data-slot="2"><div class="slot-num">2</div><div class="slot-name">Waiting to join…</div><div class="slot-status">—</div></div>
    <div class="hud-slot" data-slot="3"><div class="slot-num">3</div><div class="slot-name">Waiting to join…</div><div class="slot-status">—</div></div>
    <div class="hud-slot" data-slot="4"><div class="slot-num">4</div><div class="slot-name">Waiting to join…</div><div class="slot-status">—</div></div>
  </section>

  <footer id="dev-bar">
    <span class="dev-label">DEV</span>
    <button id="btn-simulate-joins">Simulate joins</button>
    <button id="btn-simulate-submissions">Simulate submissions</button>
    <button id="btn-skip-reveal">Skip to reveal</button>
    <button id="btn-reset">New Session</button>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/scene/scene.js"></script>
  <script src="/app.js"></script>
</body>
</html>
